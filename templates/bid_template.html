{% extends "base.html" %}
{% block title %}投标文档模板生成{% endblock %}
{% block page_title %}投标文档模板生成与自动化填写{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:440px 1fr;gap:20px">
    <div class="card">
        <div class="card-title">
            填写字段
            <span style="font-size:12px;color:var(--text-tertiary);font-weight:normal;margin-left:12px">
                文件：{{ bid.title }}
            </span>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="form-group">
                    <label>文档标题（固定）</label>
                    <input type="text" value="{{ bid.title }}" readonly style="background:#fafafa">
                </div>
                <div style="max-height:55vh;overflow-y:auto;padding-right:8px">
                    {% for key, val in fields.items() %}
                    <div class="form-group">
                        <label>【{{ key }}】{% if not val %}<span style="color:var(--warning);font-size:11px;margin-left:6px">未提取到，请填写</span>{% endif %}</label>
                        <input type="text" name="var_{{ key }}" value="{{ val }}" placeholder="请输入{{ key }}">
                    </div>
                    {% endfor %}
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
                    <a class="btn btn-default" href="{{ url_for('bid_list') }}">返回</a>
                    <button class="btn btn-primary" type="submit">生成投标文档</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            投标文档模板预览
            <span style="font-size:12px;color:var(--text-tertiary);font-weight:normal;margin-left:12px">
                【】为可填写变量，左侧填写后自动替换
            </span>
        </div>
        <div class="card-body">
            <div style="border:1px solid var(--border-split);border-radius:8px;padding:28px;
                        background:#fffdf7;font-size:13px;line-height:2;white-space:pre-wrap;
                        max-height:70vh;overflow-y:auto;color:var(--text-secondary);font-family:'Microsoft YaHei',sans-serif">
{{ template_text }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
